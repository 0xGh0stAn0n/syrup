name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/syrup-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the extension
        run: |
          cargo fmt --manifest-path crates/syrup-python/Cargo.toml -- --check
          cargo clippy --manifest-path crates/syrup-python/Cargo.toml -- -D warnings
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install "./python[test]" opencv-python-headless
      - name: Test
        run: pytest python/tests
