name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Open a window to capture
        if: runner.os == 'Windows'
        run: Start-Process notepad
      - name: Test
        run: cargo test --workspace
        env:
          SYRUP_EXPECT_WINDOW: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Build
        run: cargo build --workspace --all-targets

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/syrup-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the extension
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path crates/syrup-python/Cargo.toml -- --check
          cargo clippy --manifest-path crates/syrup-python/Cargo.toml -- -D warnings
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install
        run: pip install "./python[test]" opencv-python-headless
      - name: Test
        run: pytest python/tests

  # The model recipes, on real photographs. Heavy dependencies, so a job of
  # their own; elsewhere these tests skip.
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/syrup-python -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgles2
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "./python[test,yolo,mediapipe]"
      - name: Test
        run: pytest python/tests/test_recipes.py -v
