[package]
name = "syrup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small toolkit for turning captured frames into structured, confidence-scored visual observations"
repository = "https://github.com/boggioMichael/syrup"
keywords = ["computer-vision", "screen-capture", "ocr", "detection"]
categories = ["computer-vision", "multimedia::images"]

[dependencies]
image = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "primitives"
harness = false

# The core stays a standalone package at the root, so path and submodule
# consumers keep working. The runtime that turns intents into compiled
# native operations is a separate member; the Python extension is built by
# maturin with its own lockfile (it links against Python, which a plain
# `cargo test --workspace` should not need).
[workspace]
members = ["crates/syrup-runtime"]
exclude = ["crates/syrup-python"]

# Face detection runs in tests; unoptimised tract makes them crawl.
[profile.dev]
# Full debug info made the target directory tens of gigabytes; line tables
# keep backtraces readable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
